# Dyn-VGGT stage S0 / P3a — align the new heads only (docs §7).
# Freeze the entire pretrained backbone + original heads; train ONLY motion_head + flow_head,
# with ONLY L_motion + L_flow active. Warm-start from pretrained VGGT-1B (strict: False).
# Goal: get m / Δ to a usable state WITHOUT touching (and risking) the pretrained geometry.
defaults:
  - default_dataset.yaml

exp_name: dyn_vggt_po_s0_smoke
img_size: 518
num_workers: 2
seed_value: 42
accum_steps: 2
patch_size: 14
val_epoch_freq: 1
max_img_per_gpu: 8

limit_train_batches: 30
limit_val_batches: 2


data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      repeat_batch: False
      img_nums: [2, 4]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.pointodyssey.PointOdysseyDataset
          split: train
          PO_DIR: /media/cvml-75/ssd2t1/data/point_odyssey
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      img_nums: [2, 4]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.pointodyssey.PointOdysseyDataset
          split: test
          PO_DIR: /media/cvml-75/ssd2t1/data/point_odyssey


logging:
  log_dir: logs
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_motion
        - loss_conf_flow
        - loss_reg_flow
    val:
      keys_to_log:
        - loss_objective
        - loss_motion
        - loss_reg_flow


checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 1
  resume_checkpoint_path: /home/cvml-75/Desktop/vggt/training/checkpoints/VGGT-1B.pt   # warm-start; new modules load as missing keys
  strict: False


loss:
  _target_: loss.MultitaskLoss
  # S0: ONLY the two new heads are supervised. Everything else is off (null -> branch skipped).
  camera: null
  depth: null
  point: null
  track: null
  motion:
    weight: 1.0               # BCE vs GT dynamic mask (docs §6.2-1)
  flow:
    weight: 0.5               # dense assembled-point supervision of Δ (docs §6.2-2)
    gamma: 1.0
    alpha: 0.2
    valid_range: 0.98
  reproj: null
  tsmooth: null


optim:
  param_group_modifiers: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 0.05
  # Freeze the whole pretrained network; only motion_head + flow_head stay trainable.
  frozen_module_names:
      - "*aggregator*"
      - "*camera_head*"
      - "*depth_head*"
      - "*point_head*"
  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["motion_head", "flow_head"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 1e-4
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-4
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05


max_epochs: 1

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: True
  enable_depth: True
  enable_point: True          # required: X^can (rigid branch) feeds the assembled point for L_flow
  enable_track: False
  enable_temporal: True       # present so checkpoints stay compatible across stages (γ=0 -> identity)
  enable_motion: True
  enable_flow: True


distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: True
  timeout_mins: 30
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
    cudnn_deterministic: False
    cudnn_benchmark: False
    allow_tf32: True
