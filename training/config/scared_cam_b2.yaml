# SCARED camera-pose adaptation -- the 2-block arm.
#
# INHERITS scared_cam_b16.yaml (read its header first: the question, the zero-shot numbers to
# beat, why the gate is inert here, and why max_epochs must stay 10). The two differ in ONE
# thing and nothing else, which is what makes the comparison clean:
#     scared_cam_b2   -- global blocks 8,9 trainable   (14 blocks frozen)
#     scared_cam_b16  -- global blocks 8..23 trainable
#
# History: this arm exists by accident. The original single config intended 8..23 but its glob
# `*aggregator.global_blocks.[0-7]*` also matched 10-23 (wcmatch `[0-7]` eats ONE character,
# the trailing `*` eats the second digit), so what actually ran was the 2-block variant -- and
# it reached ATE 0.956 mm (-45% vs inst_g) in 3 epochs, which is why it is worth keeping as
# its own arm rather than discarding. Every pre-2026-08-18 S1 config still carries that bug.
defaults:
  - scared_cam_b16
  - _self_

exp_name: scared_cam_b2

optim:
  # Same list as the parent PLUS blocks 10-23, leaving only 8 and 9 trainable.
  # Hydra REPLACES lists rather than merging them, so the whole list is restated.
  frozen_module_names:
      - "*aggregator.patch_embed*"
      - "*aggregator.frame_blocks*"
      - "*aggregator.temporal_blocks*"
      - "*aggregator.gate_predictor*"
      - "*aggregator.global_blocks.[0-7]"
      - "*depth_head*"
      - "*aggregator.global_blocks.1[0-9]"
      - "*aggregator.global_blocks.2[0-3]"
