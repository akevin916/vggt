# Dyn-VGGT v3 — Stage S1, POST-FIX factor-ablation RUN 1 / base (docs/dyn_vggt_method_v3.md §8.3).
#
# This is the GATE→CAMERA base of the four-run factor ablation. It answers the gating question
# (§8.3 run 1): under the CORRECTED frame-interleaved gate forward (commit e064087), does the
# gate move `predicted` pose toward `oracle`? No extra loss, no extra unfreeze — just gate +
# camera on the now-working forward. run 1 is the gate that decides whether stacking runs 2/3/4
# is even worth it (method_v3 §8.3: "gate 若在 base 就無效，先別急著疊 2/3/4").
#
# UNIFIED ABLATION HARNESS (identical across runs 1–4, so each factor's marginal pose gain is
# cleanly attributable — same data / schedule / img_nums / val, ONLY unfreeze+loss differ):
#   data     : 4-dataset MonST3R mix (PO 10000 : TartanAir 5000 : Waymo 4000 : Spring 1000).
#   val      : Sintel cross-domain (gt_flow mask). Two channels (see pose_eval block below):
#              best.pt is selected by channel B = deterministic full-sequence Sintel pose ATE;
#              the windowed Sintel val here (channel A) is overfitting-monitoring ONLY.
#   schedule : max_epochs 50 × limit_train_batches 3000 = 150k steps. img_nums [4,16].
#   Motion-mask sources / Spring RAFT-blowout guard: see the run-4 config header for the full note.
#   VRAM: run 1 is the LIGHTEST (no depth/photo/temporal grad). max_img_per_gpu 16 matches run 4;
#   keep it equal across runs for a fair batch — if run 4 OOMs, drop ALL four runs together.
#
# UNIFIED ARCHITECTURE (§8.3): every run is built enable_gate=True + enable_temporal=True. Here
# temporal_blocks stay γ=0 identity AND frozen (≡ absent), but the checkpoint still CARRIES their
# weights → runs 2/3/4 warm-start off run 1 with no missing keys.
#
# WARM-START: checkpoints/dyn_vggt_v3_s0_inst.pt (same gate+temporal flags → clean key load). The
# S0 gate is BCE-supervised, independent of the §4 attention bug (§8.1), so it is reused as-is.
# Inherits everything from default.yaml; only the deltas below are specified.
defaults:
  - default
  - _self_

exp_name: dyn_vggt_v3_s1_inst
num_workers: 0
accum_steps: 1
val_epoch_freq: 1
max_img_per_gpu: 16
max_epochs: 50
limit_train_batches: 3000

# best.pt = best full-sequence Sintel ATE (deterministic channel B, not the windowed val ATE).
# VGGT pose eval is a single feedforward (no TTO like MonST3R), so it's cheap enough to run
# every epoch -- and with few epochs we want the finest-grained selection signal. Windowed
# val_metrics stays on as channel A: held-out loss (loss_camera/loss_gate) for overfitting
# monitoring only -- it no longer selects best.pt.
pose_eval:
  enabled: true
  every_n_epochs: 1
  sintel_root: ../data/eval/sintel
  chunk_size: 0


data:
  train:
    common_config:
      img_nums: [4, 16]
    dataset:
      dataset_configs:
        - _target_: data.datasets.pointodyssey.PointOdysseyDataset
          split: train
          PO_DIR: ../data/train/point_odyssey
          dynamic_source: instance
          len_train: 10000
        - _target_: data.datasets.tartanair.TartanAirDataset
          TARTANAIR_DIR: ../data/train/tartanair
          len_train: 5000
        - _target_: data.datasets.waymo.WaymoDataset
          WAYMO_DIR: ../data/train/waymo_processed
          dynamic_source: raft
          dynamic_max_frac: 0.5
          len_train: 4000
        - _target_: data.datasets.spring.SpringDataset
          split: train
          SPRING_DIR: ../data/train/spring
          dynamic_source: raft
          dynamic_max_frac: 0.5
          len_train: 1000
  val:
    common_config:
      img_nums: [4, 16]
    dataset:
      dataset_configs:
        - _target_: data.datasets.sintel.SintelDataset
          SINTEL_DIR: ../data/eval/sintel
          dynamic_source: gt_flow


logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_T
        - loss_R
    val:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera


checkpoint:
  save_freq: 10
  # Mid-epoch rolling checkpoint: overwrite last.pt every N train iters so a crash mid-epoch
  # (this run keeps dying to SIGBUS ~random step) resumes from the last save + fast-forwards
  # the dataloader, instead of reverting to the previous epoch. 0 disables. Each trigger is a
  # full ~7 GB last.pt write (.bak-protected) -> ~every 500 iters ≈ 15-20 min; tune to taste.
  save_steps_freq: 1000
  # RESUME MODE (run was killed externally at epoch 3, 2026-07-10): null → auto-load
  # logs/dyn_vggt_v3_s1_inst/ckpts/last.pt (full optimizer/epoch/best_ate=0.1594 state) and
  # continue from epoch 3. The 3 completed epochs and the LR-schedule position are preserved.
  # To start a NEW from-scratch run instead, delete logs/dyn_vggt_v3_s1_inst/ AND set this back
  # to checkpoints/dyn_vggt_v3_s0_inst.pt (the fresh-from-S0 warm-start).
  resume_checkpoint_path: null


loss:
  # RUN 1 base: gate + camera only. Depth/photo/smooth all off — this is the pure gate→camera test.
  camera:
    weight: 5.0
    loss_type: "l1"
    gamma: 0.6
  depth: null
  motion: null
  flow: null
  reproj: null
  tsmooth: null
  gate:
    weight: 1.0
    patch_size: ${patch_size}
  static_photo: null
  camera_smooth: null


optim:
  optimizer:
    lr: 3e-5
  # Base unfreeze set: gate_predictor + global_blocks[8..23] + camera_head (+ camera/register
  # tokens). Everything else frozen — including temporal_blocks and depth_head (runs 2/3/4 add
  # those back one factor at a time).
  frozen_module_names:
      - "*aggregator.patch_embed*"
      - "*aggregator.frame_blocks*"
      - "*aggregator.temporal_blocks*"
      # global_blocks 0..7 (indices 0-7) frozen; 8..23 trainable ([0-7] is an fnmatch class).
      - "*aggregator.global_blocks.[0-7]*"
      - "*depth_head*"
      # point_head / motion_head / flow_head do not exist in this model config → omit.
  gradient_clip:
    configs:
      - module_name: ["aggregator.gate_predictor", "aggregator.global_blocks", "camera_head"]
        max_norm: 1.0
        norm_type: 2
      # aggregator.camera_token / register_token are nn.Parameters (not modules), trainable in S1.
      - module_name: ["aggregator.camera_token", "aggregator.register_token"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 3e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 3e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']


model:
  enable_temporal: True
  enable_motion: False
  enable_flow: False
  enable_gate: True
  gate_block_iter: 7


distributed:
  find_unused_parameters: True
