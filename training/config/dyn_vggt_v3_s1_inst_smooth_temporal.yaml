# Dyn-VGGT v3 — Stage S1, POST-FIX factor-ablation RUN 2 (docs/dyn_vggt_method_v3.md §8.3).
#
# base (run 1) + ONE factor: unfreeze aggregator.temporal_blocks and add the camera_smooth loss
# (§7.2). Measures the MARGINAL contribution of "temporal pathway + trajectory-acceleration
# smoothing" to pose (ATE / trajectory jitter) on top of the gate→camera base. Attribution vs
# run 1 is only valid because everything else (data/schedule/img_nums/val) is identical — see the
# run-1 config header for the shared harness.
#
# NOTE (§6): camera_smooth is a self-referential prior on the PREDICTED pose (no GT); temporal is
# the architectural pathway that lets it reach neighbouring frames. If run 2 beats run 1, still
# disambiguate whether it's the temporal structure or the smooth loss doing the work.
#
# WARM-START: run 1's best.pt. Copy it to checkpoints/dyn_vggt_v3_s1_inst.pt after run 1 finishes
# (from logs/dyn_vggt_v3_s1_inst/ckpts/best.pt). Chaining off run 1 — NOT off S0 — is the point:
# run 1 already brought the camera path onto the working gate, so run 2 isolates the temporal
# factor rather than re-learning gating. temporal_blocks weights are present in run 1's ckpt
# (γ=0 identity) → clean key load.
# Inherits everything from default.yaml; only the deltas below are specified.
defaults:
  - default
  - _self_

exp_name: dyn_vggt_v3_s1_inst_smooth_temporal
num_workers: 4
accum_steps: 1
val_epoch_freq: 1
max_img_per_gpu: 16
max_epochs: 50
limit_train_batches: 3000


data:
  train:
    common_config:
      img_nums: [4, 16]
    dataset:
      dataset_configs:
        - _target_: data.datasets.pointodyssey.PointOdysseyDataset
          split: train
          PO_DIR: ../data/train/point_odyssey
          dynamic_source: instance
          len_train: 10000
        - _target_: data.datasets.tartanair.TartanAirDataset
          TARTANAIR_DIR: ../data/train/tartanair
          len_train: 5000
        - _target_: data.datasets.waymo.WaymoDataset
          WAYMO_DIR: ../data/train/waymo_processed
          dynamic_source: raft
          dynamic_max_frac: 0.5
          len_train: 4000
        - _target_: data.datasets.spring.SpringDataset
          split: train
          SPRING_DIR: ../data/train/spring
          dynamic_source: raft
          dynamic_max_frac: 0.5
          len_train: 1000
  val:
    common_config:
      img_nums: [4, 16]
    dataset:
      dataset_configs:
        - _target_: data.datasets.sintel.SintelDataset
          SINTEL_DIR: ../data/eval/sintel
          dynamic_source: gt_flow


logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_T
        - loss_R
        - loss_camera_smooth
        - loss_smooth_T
        - loss_smooth_R
    val:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_camera_smooth


checkpoint:
  save_freq: 5
  # Warm-start from run 1. Copy logs/dyn_vggt_v3_s1_inst/ckpts/best.pt here first.
  # After epoch 1, flip to null so restarts self-heal from this run's last.pt.
  # Flipped to null (2026-07-26): warm-start already consumed; resume this run's
  # last.pt (epoch 15) via get_resume_checkpoint instead of restarting from run 1.
  resume_checkpoint_path: null


loss:
  # RUN 2: gate + camera + camera_smooth. Depth/photo off (isolate the temporal+smooth factor).
  camera:
    weight: 5.0
    loss_type: "l1"
    gamma: 0.6
  depth: null
  motion: null
  flow: null
  reproj: null
  tsmooth: null
  gate:
    weight: 1.0
    patch_size: ${patch_size}
  static_photo: null
  camera_smooth:
    weight: 3.0
    weight_trans: 1.0
    weight_rot: 1.0
    gamma: 0.6


optim:
  optimizer:
    lr: 3e-5
  # Base unfreeze + temporal_blocks. depth_head still frozen (that's run 3/4's factor).
  frozen_module_names:
      - "*aggregator.patch_embed*"
      - "*aggregator.frame_blocks*"
      # global_blocks 0..7 frozen; 8..23 trainable ([0-7] is an fnmatch class).
      - "*aggregator.global_blocks.[0-7]*"
      - "*depth_head*"
      # temporal_blocks intentionally NOT frozen here — this run's factor.
      # point_head / motion_head / flow_head do not exist in this model config → omit.
  gradient_clip:
    configs:
      - module_name: ["aggregator.gate_predictor", "aggregator.global_blocks", "camera_head"]
        max_norm: 1.0
        norm_type: 2
      # Newly-unfrozen this run — own entry so its grad-norm is logged/tightened separately.
      - module_name: ["aggregator.temporal_blocks"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["aggregator.camera_token", "aggregator.register_token"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 3e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 3e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']


model:
  enable_temporal: True
  enable_motion: False
  enable_flow: False
  enable_gate: True
  gate_block_iter: 7


distributed:
  find_unused_parameters: True
