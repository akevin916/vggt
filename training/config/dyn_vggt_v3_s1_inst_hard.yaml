# Dyn-VGGT v3 — Stage S1, C-1 sanity check: HARD LABEL + boundary ignore-band.
#
# Identical to the run-1 base (dyn_vggt_v3_s1_inst) in EVERY respect — same 4-dataset mix,
# schedule, unfreeze set, val, warm-start — EXCEPT the gate loss discretises its label:
#   m*_patch >= hard_hi (0.7) -> 1 ,  <= hard_lo (0.3) -> 0 ,  boundary band (0.3,0.7) IGNORED.
#
# WHY (欠自信 診斷): the base's average-pooled soft label gives boundary patches fractional
# targets (~0.3-0.5). Per-patch BCE then has an irreducible floor there, training σ(g) to hedge
# → gate under-confident (AUC 0.88 but F1 0.35, p_dyn≈0.3, predicted≈off). C-1 removes that floor
# so confident patches drive g decisive. Read AUC/F1 + Sintel pose vs run-1 base — NOT BCE
# (loss_gate is no longer comparable across the two: different label set / normalisation).
#
# WARM-START: from the SAME clean S0 checkpoint as run 1 (fresh, not off run-1's last.pt), so the
# only variable vs run 1 is the label discretisation. New exp_name → its own logs/ dir.
defaults:
  - dyn_vggt_v3_s1_inst
  - _self_

exp_name: dyn_vggt_v3_s1_inst_hard

loss:
  gate:
    hard_lo: 0.3
    hard_hi: 0.7

checkpoint:
  # fresh warm-start off S0 (run-1's last.pt lives under a different exp_name, so null here
  # auto-loads logs/dyn_vggt_v3_s1_inst_hard/ckpts/last.pt only after this run's own first save).
  resume_checkpoint_path: checkpoints/dyn_vggt_v3_s0_inst.pt
