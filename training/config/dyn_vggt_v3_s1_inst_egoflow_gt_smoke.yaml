# Smoke test for dyn_vggt_v3_s1_inst_egoflow_gt — 20 steps, one epoch, no pose eval.
#
# Its job is the weight: the GT-depth residual is a different quantity from the predicted-depth
# one, so nothing about its magnitude carries over. Read Loss/train_loss_ego_flow off the log and
# set the real config's weight to 0.0162 / E for an ~8% share (derivation in that config).
#
# Also re-checks the two things the previous smoke run caught: that the term is actually wired
# (loss_ego_flow_pairs > 0) and that memory fits. Memory should be BELOW the previous run's
# 31 GB — depth_head is frozen and L_depth is off, so its gradients and optimizer state are gone.
#
# Shape is pinned to the worst case (16-frame clips, square crop): DynamicBatchSampler draws the
# clip length uniformly and sets batch_size = floor(16 / length), so image count per step is ~16
# either way but the aggregator's global attention runs over one clip's tokens, ~ B * (S*P)^2 —
# 4x more at S=16 than S=4. 20 random steps can easily never draw 16.
#
# Separate exp_name so the real run's log directory stays clean (an existing last.pt makes the
# trainer refuse to start).
#
# Read with:  python diag/train_health.py --exp dyn_vggt_v3_s1_inst_egoflow_gt_smoke
defaults:
  - dyn_vggt_v3_s1_inst_egoflow_gt
  - _self_

exp_name: dyn_vggt_v3_s1_inst_egoflow_gt_smoke

max_epochs: 1
limit_train_batches: 20
limit_val_batches: 4

pose_eval:
  enabled: false

data:
  train:
    common_config:
      img_nums: [16, 16]
      augs:
        aspects: [1.0, 1.0]
