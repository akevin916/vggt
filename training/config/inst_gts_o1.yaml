# Dyn-VGGT v3 — S1, 強化的軌跡平滑先驗（一階 + 二階）。
#
# 相對 run 2（inst_gts，目前最佳 lineage）只動 camera_smooth 一項：
#   (a) 加入一階（罰運動本身，MonST3R relative_pose_loss 的形式）
#   (b) 把整個平滑項的權重拉到主導地位（目前只佔目標函數 2.9%）
# 這兩件事概念上是同一個介入（「強的一階先驗」），分開測要兩輪 26 小時；先合併測，若有效再拆。
# 對照組 = run 2 的 epoch_30（ATE 0.1343 / RPE-t 0.0633 / RPE-rot 0.3943 / AbsRel 0.1842，
# 以 benchmark/eval_sintel.py --max_depth 80 同協定量得），已存在，不需另跑。
#
# 為什麼是一階 —— TTO 線的逐序列證據（docs/ego_flow.md §6）：
#     seq        base      二階 w30        一階 w30        一階+flow
#     cave_2     0.8298    0.7483 (-10%)   0.5527 (-33%)   0.4600 (-45%)
#     temple_3   0.4505    0.3849 (-15%)   0.1850 (-59%)   0.1770 (-61%)
# 一階把初值最爛的兩個序列砍掉一半以上，二階只動 10~15%。而且二階「加大權重」買不到這個 ——
# 它的 TTO 權重掃描是平的（w10 0.1154 / w30 0.1128 / w100 0.1134 / w300 0.1147），已飽和。
#
# 一階需要煞車，這是它在 TTO 單獨使用時會炸掉初值良好序列的原因（temple_2 0.0443 -> 0.3851，
# 8.7 倍）。TTO 的煞車是 flow；**訓練的煞車是 L_cam，而且是精確的**（直接對 GT 位姿）。所以
# 訓練側的行為應該接近 TTO 的「一階 + flow」那一欄，而不是「一階單獨」那一欄。這是本 run 要驗證
# 的核心假設。
#
# 已知的風險，第一次跑就要看：一階罰的是運動本身，而 Waymo 等速直行、TartanAir 連續飛行 ——
# 這個先驗對它們是錯的，且訓練是 amortized（一個模型吃所有序列，無法逐序列調節強度）。
# 失敗的樣子是初值良好的序列退步（TTO 裡 sleeping_2 / market_2 / alley_2 退 1.5~6 倍）。
#
# 讀結果的方式 —— **必須逐序列，不能只看平均**。一階的價值集中在最爛的少數序列，
# 平均值會被容易序列的退步抵銷掉。要問的是「cave_2 / temple_3 有沒有被拉回來」。
defaults:
  - inst_gts
  - _self_

exp_name: inst_gts_o1
max_epochs: 20


pose_eval:
  enabled: true
  every_n_epochs: 1


checkpoint:
  save_freq: 5
  # 純權重。完整 trainer checkpoint 帶 prev_epoch=29，`while self.epoch < self.max_epochs`
  # (trainer.py:495) 會直接不進迴圈 —— 靜默結束、exit code 0、無 traceback。
  resume_checkpoint_path: checkpoints/inst_gts.pt


loss:
  camera_smooth:
    # 校準自 inst_gts_o1_smoke（21 步、同 warm start、clip 形狀釘在最壞情況）。
    # 一階是速度、二階是加速度，不同量綱，不能給同一個權重。量到的 per-order（未加權）：
    #     一階 T1 0.00178 + R1 0.00060 = 0.00239
    #     二階 T2 0.00078 + R2 0.00054 = 0.00132        二階/一階 = 0.553
    # → order_weights [0.553, 1.0] 讓兩階的貢獻相當。
    #
    # weight：其他項（camera x5 + gate）= 0.1815，要讓平滑佔目標函數 25% 需 weighted ≈ 0.0605，
    # 而 weight=1 時平滑項是 0.00264 → weight = 22.9。
    # 對照：**原本 weight=3.0 只佔 5.8%**，這是「平滑先驗被嚴重低估」的直接證據 ——
    # TTO 所有獲勝設定都是平滑主導（smooth w=30 : flow w=1），訓練側卻反過來。
    weight: 22.9
    orders: [1, 2]
    order_weights: [0.553, 1.0]
    weight_trans: 1.0
    weight_rot: 1.0
    gamma: 0.6


optim:
  # 峰值 LR 1e-5，與 egoflow 系列一致，三個 run 之間也可比。
  optimizer:
    lr: 1e-5
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 1e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']


logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_T
        - loss_R
        - loss_camera_smooth
        - loss_smooth_T
        - loss_smooth_R
        - loss_smooth_T1      # per-order，未加權 —— 校準 order_weights 用
        - loss_smooth_R1
        - loss_smooth_T2
        - loss_smooth_R2
    val:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_camera_smooth
        - loss_smooth_T1
        - loss_smooth_T2
