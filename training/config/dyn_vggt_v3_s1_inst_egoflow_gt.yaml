# Dyn-VGGT v3 — Stage S1, ego-flow with GT depth ("option C").
#
# ONE change from run 2 (dyn_vggt_v3_s1_inst_smooth_temporal): add L_ego_flow. depth_head stays
# frozen, L_depth stays off, the freeze list and every other loss are inherited untouched. That
# is the entire point — run 2's epoch_30 (ATE 0.1343 / RPE-t 0.0673 / RPE-r 0.4940) IS the
# control, so this costs one run instead of two.
#
# WHY GT DEPTH. ego-flow's translation term is `disparity * t`. Feeding it predicted depth opens
# a shortcut: a global depth-scale error is exactly cancelled by a translation-scale error, and
# translation scale is precisely what ATE measures. With GT depth on both sides the disparity
# field is identical and cancels, leaving
#     flow_pred - flow_gt  ~  [rotation term] + disp_gt * K (t_rel_pred - t_rel_gt)
# — relative-pose error, weighted by observability (near = large disparity = translation visible;
# far = translation barely moves a pixel). Nothing else can move to hide a pose error.
#
# WHAT IT IS AND IS NOT. This is not MonST3R's depth/pose coupling — that needs predicted depth
# with gradient, which is dyn_vggt_v3_s1_inst_egoflow.yaml. What it tests is narrower and
# cleaner: does supervising RELATIVE pose in PIXEL space beat supervising ABSOLUTE pose in
# pose-encoding space (L_cam)? Two structural differences from L_cam, not just a reweighting:
#   * pairwise vs per-frame — L_cam constrains no relative motion at all, and relative error is
#     what accumulates into drift and what RPE measures;
#   * pixel-space vs parameter-space — errors are weighted by how observable they are, which is
#     why bundle adjustment minimises reprojection error rather than pose-parameter error.
#
# PRIOR RESULT TO BEAT (dyn_vggt_v3_s1_inst_egoflow, predicted depth + thawed depth_head, done):
#     ATE 0.1557 (+15.9% WORSE)   RPE-t 0.0629 (-6.5%)   RPE-r 0.4399 (-11.0%)
# It traded global trajectory accuracy for local. Attribution was impossible there because it
# changed three things at once; here there is only one.
#
# Freezing depth_head would NOT have been enough on its own to isolate this: freeze.py sets
# requires_grad=False, which stops that head's parameters from updating but not gradient from
# flowing through it into the unfrozen trunk. use_gt_depth removes the path entirely.
defaults:
  - dyn_vggt_v3_s1_inst_smooth_temporal
  - _self_

exp_name: dyn_vggt_v3_s1_inst_egoflow_gt
max_epochs: 20


pose_eval:
  enabled: true
  every_n_epochs: 1


checkpoint:
  save_freq: 5
  # Weights only. A full trainer checkpoint carries prev_epoch=29, so `while self.epoch <
  # self.max_epochs` (trainer.py:495) starts at 30 and a 20-epoch config exits immediately having
  # trained nothing — silently, exit code 0. The LR schedule is driven by absolute epoch
  # (trainer.py:821) for the same reason. Produced with extract_weights.py from
  # checkpoints/dyn_inst_temporal_smooth.pt (= run 2's epoch_30.pt, md5 67bbebf4...).
  resume_checkpoint_path: checkpoints/dyn_inst_temporal_smooth_weights.pt


loss:
  # depth stays null and depth_head stays frozen (both inherited from run 2) — that is what makes
  # run 2 a valid control.
  ego_flow:
    # Calibrated on dyn_vggt_v3_s1_inst_egoflow_gt_smoke (21 steps, same warm start, clip shape
    # pinned to the worst case). Measured weighted contributions:
    #     camera 0.0086 x5 = 0.0431   gate 0.1384   smooth 0.0039   -> other terms 0.1855
    #     loss_ego_flow mean 0.7485 (median 0.4503; heavy right tail, so the MEAN is what an
    #     epoch's gradient actually sees)
    #   weight = (0.08/0.92) * 0.1855 / 0.7485 = 0.0215
    #
    # WORTH RECORDING: the same smoke run with PREDICTED depth measured 0.7933. Swapping in GT
    # depth removed only 5.6% of the residual, so ~94% of what this term sees is POSE error, not
    # depth error. Two consequences: this configuration loses almost no signal by giving up the
    # depth path, and MonST3R's depth/pose coupling has little to work with here in the first
    # place.
    weight: 0.0215
    use_gt_depth: True
    beta: 1.0
    per_pixel_thre: 5.0      # MonST3R's 50 rejects nothing here; 5 trims the p99 tail only
    target_from_pose_encoding: True
    max_dt: 5
    bidirectional: True
    use_dynamic_mask: True   # measured: dropping it raises the residual 65% on Sintel


optim:
  # Peak LR 1e-5, matching the previous run so the two are comparable to each other as well as
  # to run 2. Both the optimizer lr and the scheduler endpoints have to move together.
  optimizer:
    lr: 1e-5
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 1e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']


logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_T
        - loss_R
        - loss_camera_smooth
        - loss_smooth_T
        - loss_smooth_R
        - loss_ego_flow
        - loss_ego_flow_kept
        - loss_ego_flow_pairs
    val:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_camera_smooth
        - loss_ego_flow
