# C3VD baseline: STOCK VGGT-1B fine-tuned on C3VD, camera loss only.
#
# WHY THIS FIRST. The medical line is report material, not a paper table, and the baseline
# policy (project memory) says the comparison row must be a FINE-TUNED VGGT-1B -- beating a
# model that has never seen an endoscope is not a claim. This config is that row, and it is
# also the smallest thing that can run end to end on C3VD, so it doubles as the wiring test.
# The v3 arms (gate/temporal) come later as deltas on top; C3VD is a RIGID phantom with a
# moving camera, so L_gate in particular has nothing to learn here.
#
# INHERITS `default` directly rather than the scared_cam_* chain: that chain carries SCARED's
# data block, its pose_eval channel and its depth ceiling, all three of which would have to be
# switched back off one by one. Structure deliberately mirrors scared_cam_vanilla so the two
# datasets stay readable side by side.
#
# THE SAMPLING WINDOW IS THE ONE REAL C3VD-SPECIFIC DECISION. Measured GT camera displacement
# over all 22 sequences (data/preprocess/c3vd_convert.py + pose.txt), median across sequences:
#
#     gap    1 frame     0.06 mm
#     gap   24 frames    1.44 mm     <- the inherited window (expand_ratio 2.0, +-2*12)
#     gap  120 frames    7.57 mm
#     median scene depth 20.7 mm
#
# At the default window the baseline is 7% of scene depth: the camera has effectively not
# moved, and translation is close to unobservable. At +-120 it is 37%. This mirrors what the
# SCARED arms already showed (arm 3 widened to 120 and went 0.9108 -> 0.8150), except the
# effect is stronger here because a colonoscope loiters more than a laparoscope.
# CAVEAT, stated rather than buried: displacement varies wildly per sequence -- trans_t2_b
# covers 49.7 mm in 103 frames while trans_t3_b covers 11.3 mm in 214. Four sequences
# (trans_t1_b, t3_a, t3_b, t4_b) stay under 2.6 mm even at gap 120 and are near-degenerate
# for pose no matter what this knob is set to.
#
# DEPTH IS IN MILLIMETRES and clamped at 100 by the release itself (c3vd_convert.py rescales
# to the SCARED uint16 convention). `depth_max: 100.0` is that ceiling, not a tuning knob.
#
# pose_eval (channel B) scores the live model with benchmark/eval_c3vd.py on the SAME val
# split channel A computes loss over, as full contiguous sequences with Sim3-aligned ATE, and
# it is what drives best_ate.pt. n_frames is 50 rather than the ~80 VGGT tops out at: C3VD is
# SQUARE (1024x1024 -> 518x518 = 1369 patches) where SCARED is 1280x1024 (-> 518x420 = 1110),
# so a C3VD frame costs ~23% more attention and the practical ceiling sits lower.
# READ THE PER-SEQUENCE NUMBERS, NOT JUST THE MEAN: val holds trans/t3_b, whose camera travels
# only 11.3 mm across 214 frames. Its ATE is small because nothing moved, not because the pose
# is good. results.json reports ate_rel (ATE / trajectory bbox diagonal) for exactly this.
defaults:
  - default
  - _self_

exp_name: c3vd_cam_vanilla
num_workers: 4
accum_steps: 1
val_epoch_freq: 1
max_img_per_gpu: 12
max_epochs: 10
limit_train_batches: 1500

pose_eval:
  enabled: true
  dataset: c3vd
  every_n_epochs: 1
  split: val          # same split as channel A, on purpose
  n_frames: 50        # 3 sequences x 50 frames, one forward pass each
  max_depth: 100.0    # mm -- the C3VD release's own depth clamp


data:
  train:
    common_config:
      img_nums: [4, 12]
    dataset:
      dataset_configs:
        - _target_: data.datasets.c3vd.C3vdDataset
          split: train
          C3VD_DIR: ../data/train/c3vd
          len_train: 6000
          depth_max: 100.0          # millimetres; the release's own clamp
          dynamic_source: none
          nearby_expand_range: 120  # see header
  val:
    common_config:
      img_nums: [4, 12]
    dataset:
      dataset_configs:
        - _target_: data.datasets.c3vd.C3vdDataset
          split: val
          C3VD_DIR: ../data/train/c3vd
          depth_max: 100.0
          dynamic_source: none
          nearby_expand_range: 120


logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
    val:
      keys_to_log:
        - loss_objective
        - loss_camera


checkpoint:
  save_freq: 5
  save_steps_freq: 1000
  # Stock pretrained weights: a bare state_dict with no "model"/"optimizer" key, handled as
  # pure weights by _load_resuming_checkpoint. point_head/track_head keys are unexpected with
  # both heads disabled; checkpoint.strict is False in default.yaml, so they are ignored.
  resume_checkpoint_path: checkpoints/VGGT-1B.pt


loss:
  camera:
    weight: 5.0
    loss_type: "l1"
    gamma: 0.6
  depth: null
  motion: null
  flow: null
  reproj: null
  tsmooth: null
  gate: null
  static_photo: null
  camera_smooth: null


optim:
  optimizer:
    lr: 3e-5
  # global_blocks 8..23 trainable, plus camera_head + camera/register tokens. temporal_blocks
  # and gate_predictor are NOT named: with the flags off they are never constructed, so a glob
  # for them would match nothing and only mislead. Hydra REPLACES lists, so this is the whole
  # list. Note the ABSENT trailing `*`: `[0-7]*` would also match 10-23.
  frozen_module_names:
      - "*aggregator.patch_embed*"
      - "*aggregator.frame_blocks*"
      - "*aggregator.global_blocks.[0-7]"
      - "*depth_head*"
  gradient_clip:
    configs:
      - module_name: ["aggregator.global_blocks", "camera_head"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["aggregator.camera_token", "aggregator.register_token"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 3e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 3e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']


model:
  enable_temporal: False
  enable_motion: False
  enable_flow: False
  enable_gate: False
