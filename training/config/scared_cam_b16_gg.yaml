# SCARED camera-pose adaptation -- the arm where the GATE IS TRAINED.
#
# INHERITS scared_cam_b16.yaml (read its header first: the question, the zero-shot numbers to
# beat, and why max_epochs must stay 10). Only the gate-related deltas live here.
#
# THE GATE IS TRAINED IN THIS RUN. This is the arm that tests whether it can be -- the b2 and
# b16 arms leave it inert, and this one does not.
#
# Why the other arms leave it inert: `loss.gate` (BCE) needs a dynamic mask and SCARED has no
# dynamic annotation -- the loader's all-zero motion_mask is a placeholder, NOT a label, and
# the RAFT flow-residual recipe used for Spring/Waymo was measured not to work here
# (docs/scared_dataset.md). With no BCE, and with L_camera's gradient detached before the
# attention bias, nothing could train the gate at all, so those arms freeze it and say so.
#
# What changes here, and nothing else:
#   * `model.gate_pose_grad: True` -- drops that detach, so L_camera's gradient reaches the
#     GatePredictor. Verified on a CPU probe: flag off -> the predictor receives 0 gradients,
#     flag on -> all 6 parameter tensors do.
#   * `aggregator.gate_predictor` is NOT in frozen_module_names (it is in every other arm).
#   * gate_predictor gets its own gradient_clip group -- it is the only newly-trainable module.
# There is still NO `loss.gate`. The pose loss is the gate's sole teacher; this is the
# label-free option for a domain that cannot provide a mask.
#
# What this arm does NOT assume: the zero-shot ablation (gate off vs predicted: 1.7365 vs
# 1.7340 on inst_g, 1.8823 vs 1.8867 on inst_gts -- below noise) says the gate is worth
# nothing on SCARED, but it was measured on models that had never seen endoscopy. It does not
# settle whether a gate TRAINED on endoscopy matters. That question is what this run is for.
#
# WATCH FOR THE DEGENERATE SOLUTION: with no BCE anchor, nothing stops the gate collapsing to
# "everything is static" (bias -> 0, gate becomes a no-op) or drifting into a generic
# attention-temperature knob with no motion semantics. A falling ATE alone does NOT prove the
# gate learned anything about motion -- check sigma(g) overlays before claiming it did.
#
# KNOWN GRADIENT DEAD ZONE: the bias is clamp(log2 - softplus(g), max=0), so every patch with
# g < 0 sits on the flat side of the clamp and receives EXACTLY zero gradient -- and with no
# BCE term there is nothing else that could pull it back out. Zero-init would put a fresh
# model exactly on the kink, but this run warm-starts from inst_g.pt, whose gate_predictor is
# trained (linear2 |w| ~ 0.09, not zero), so an UNMEASURED fraction of patches starts already
# dead. Measure it before trusting this arm. See aggregator._gated_global_block_forward.
defaults:
  - scared_cam_b16
  - _self_

exp_name: scared_cam_b16_gg

logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - gate_g_median      # where the logits sit (clamp kink = 0)
        - gate_frac_active   # fraction of patches actually suppressed
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - gate_g_median
        - gate_frac_active

checkpoint:
  # Warm start only (never on --resume). Zeroes GatePredictor.linear2 so every logit returns
  # to g=0, the one point where d(bias)/dg is largest. See trainer._reset_gate_head.
  reset_gate_head: True

optim:
  # Parent's list MINUS gate_predictor -- that is the whole point of this arm.
  # Hydra REPLACES lists rather than merging them, so the whole list is restated.
  frozen_module_names:
      - "*aggregator.patch_embed*"
      - "*aggregator.frame_blocks*"
      - "*aggregator.temporal_blocks*"
      - "*aggregator.global_blocks.[0-7]"
      - "*depth_head*"
  gradient_clip:
    configs:
      - module_name: ["aggregator.global_blocks", "camera_head"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["aggregator.camera_token", "aggregator.register_token"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["aggregator.gate_predictor"]   # the only newly-trainable module
        max_norm: 1.0
        norm_type: 2

model:
  gate_pose_grad: True
  gate_leaky: 0.1        # clamp -> leaky, so a patch that drifts below g=0 can come back
