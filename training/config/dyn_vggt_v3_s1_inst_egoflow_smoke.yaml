# Smoke test for dyn_vggt_v3_s1_inst_egoflow — 20 steps, one epoch, no pose eval.
#
# Purpose is to answer, in ~5 minutes, the questions that would otherwise cost 4 hours of a
# real run to discover:
#   1. does it fit in memory?  run 2 peaked at 30.0 GB of the 5090's 32 GB WITHOUT a trainable
#      depth head; this run adds depth_head's 32.7M parameters (gradients + AdamW state +
#      backward activations). If this OOMs, drop max_img_per_gpu to 12 in BOTH paired configs.
#   2. is L_ego_flow wired correctly?  Loss/train_loss_ego_flow should land near 0.4-0.5
#      (diag/ego_flow_residual.py measured 0.463 mix-weighted on this exact warm-start ckpt,
#      slightly lower once target_from_pose_encoding is on). An order-of-magnitude miss is a
#      wiring bug, not a training problem.
#   3. Grad/depth_head — the number that killed run 4 (median 50 / max 1561 against a clip of
#      1.0). Visible within 20 steps.
#
# SEPARATE exp_name on purpose: the real run's logs/ directory stays untouched, so there is no
# stale last.pt to delete afterwards (the trainer refuses to start when one exists, which would
# otherwise block the real launch).
#
# Read the result with:  python diag/train_health.py --exp dyn_vggt_v3_s1_inst_egoflow_smoke
defaults:
  - dyn_vggt_v3_s1_inst_egoflow
  - _self_

exp_name: dyn_vggt_v3_s1_inst_egoflow_smoke

max_epochs: 1
limit_train_batches: 20
limit_val_batches: 4

# Channel B is a full-sequence Sintel pass; it verifies nothing about wiring or memory at this
# scale, so it is off here. It stays on (every epoch) in the real run.
pose_eval:
  enabled: false


# WORST-CASE SHAPE, pinned. Without this the memory answer is worthless: DynamicBatchSampler
# draws a clip length uniformly from img_nums and then sets batch_size = floor(16 / length), so
# the image COUNT per step is ~16 either way but the cost is not. The aggregator's global
# attention runs over one clip's tokens, i.e. ~ B * (S*P)^2:
#     S=4,  B=4  ->  4 * (4P)^2  =  64 P^2
#     S=16, B=1  ->  1 * (16P)^2 = 256 P^2      <- 4x, and only reached at the top of the range
# 20 random steps can easily never draw 16. Aspect is pinned for the same reason: 1.0 is the
# square 518x518 crop (37x37 = 1369 patches), the widest 0.33 has far fewer.
# Cost of pinning: loss magnitudes here come from 1x16-frame clips rather than the training
# mix, so read gate 1's loss_ego_flow as indicative, not as the training average.
data:
  train:
    common_config:
      img_nums: [16, 16]
      augs:
        aspects: [1.0, 1.0]
