# Dyn-VGGT v3 — Stage S1, CONTROL run for dyn_vggt_v3_s1_inst_egoflow.
#
# Identical to that config in every respect except `loss.ego_flow: null`. That single difference
# is the whole point:
#     egoflow - this              = the contribution of L_ego_flow
#     this - run2 ep30 (0.1343)   = the contribution of thawing depth_head + turning on L_depth
# Without this run the egoflow run changes three things at once (new loss, thawed depth_head,
# L_depth on) and a better or worse ATE cannot be attributed to any of them.
#
# This run is NOT a throwaway. It answers a question the project has carried unresolved since
# run 4 (dyn_vggt_v3_s1_inst_photo_smooth_temporal): whether thawing depth_head is net negative.
# Run 4 concluded it was (gradients of median 50 / max 1561 against a clip of 1.0, depth
# degraded), but that run also carried a buggy init AND static_photo, which is independently
# known to hurt pose — and static_photo never touched depth_head at all (it uses GT depth, and
# its gradient reaches only the pose). So the attribution there was never clean. Here it is.
#
# RUN THIS ONE FIRST. If depth collapses here, the egoflow run's design is broken before it
# starts and there is no point spending another ~30 h on it.
defaults:
  - dyn_vggt_v3_s1_inst_egoflow
  - _self_

exp_name: dyn_vggt_v3_s1_inst_depththaw


checkpoint:
  # Same warm start as the paired run — the comparison is meaningless otherwise. Weights only;
  # see the paired config for why the strip is required rather than cosmetic.
  resume_checkpoint_path: checkpoints/dyn_inst_temporal_smooth_weights.pt


loss:
  # THE one difference. Everything else (depth on, gate, camera, camera_smooth, weights,
  # schedule, freeze list, grad clip) is inherited unchanged from the egoflow config.
  ego_flow: null


logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_T
        - loss_R
        - loss_camera_smooth
        - loss_smooth_T
        - loss_smooth_R
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
    val:
      keys_to_log:
        - loss_objective
        - loss_gate
        - loss_camera
        - loss_camera_smooth
        - loss_reg_depth
