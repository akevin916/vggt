defaults:
  - default_dataset.yaml

exp_name: exp001
img_size: 518
num_workers: 8
seed_value: 42
accum_steps: 2    # We did not use gradient accumulation in our training, while if you suffer from OOM, you can try to use it.
patch_size: 14
max_img_per_gpu: 48

limit_train_batches: 2000
limit_val_batches: 200

# Two validation channels, structurally separate -- neither ever produces the other's signal:
#   channel A (run_val / val_epoch) -- windowed forward on held-out PO-test (data.val below),
#     LOSS ONLY (no depth/pose metric computation). Its mean camera loss drives best_loss.pt,
#     an in-domain-generalization / overfitting-health signal independent of the report data.
#   channel B (run_pose_eval / pose_eval below) -- deterministic full-sequence Sintel forward,
#     METRIC ONLY (MonST3R-style depth + evo ATE/RPE). Drives best_ate.pt, the report metric.
# See trainer.val_epoch / trainer.run_pose_eval.
pose_eval:
  enabled: true
  every_n_epochs: 1
  sintel_root: null   # null -> auto-detect from repo data/ (eval.sintel_io.resolve_sintel_root)
  seq_list: null      # null -> all Sintel eval sequences
  chunk_size: 0       # 0 = full sequence (required: chunking inflates ATE, see CLAUDE.md)
  max_depth: 80.0


data:
  # The code for data still looks too complicated. I should refactor this again (do I have time?...)
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      repeat_batch: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.co3d.Co3dDataset
          split: train
          CO3D_DIR: /YOUR/PATH/TO/CO3D
          CO3D_ANNOTATION_DIR: /YOUR/PATH/TO/CO3D_ANNOTATION
  val:
    # Channel A: held-out PO-test (disjoint sequences from train), fixed 8-frame clip length
    # (no random [4,16] range) so the camera-loss signal is stable epoch-to-epoch.
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      img_nums: [8, 8]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.pointodyssey.PointOdysseyDataset
          split: test
          PO_DIR: /media/cvml-75/ssd2t1/data/point_odyssey
          dynamic_source: instance
          len_test: 8


logging:
  log_dir: logs/${exp_name}
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth



checkpoint:
  save_dir: ${logging.log_dir}/ckpts
  save_freq: 5
  resume_checkpoint_path: /YOUR/PATH/TO/CKPT
  strict: False


loss:
  _target_: loss.MultitaskLoss
  camera: 
    weight: 5.0
    loss_type: "l1" # The paper uses smooth l1 loss, but we found l1 loss is more stable than smooth l1 and l2 loss.  
  depth:
    weight: 1.0
    gradient_loss_fn: "grad" 
    valid_range: 0.98
  point: null
  # If you want to enable point, use the following config
  # point:
  #   weight: 1.0
  #   gradient_loss_fn: "normal"
  #   valid_range: 0.98
  track: null
  static_photo: null
  # v3 extension: static-region photometric consistency (predicted pose warps a GT-static,
  # GT-depth point into frame t+1; must match real pixel content there). See dyn_vggt_v3_s1*.yaml.
  # static_photo:
  #   weight: 1.0
  #   huber_delta: 0.1
  #   dyn_thresh: 0.5
  ego_flow: null
  # v3 extension: ego-flow reprojection consistency. MonST3R's disparity-form ego-flow geometry
  # (ego_flow.py) scored against the GT-derived ego-flow rather than RAFT — so it is a pixel-space
  # reprojection loss, NOT a port of MonST3R's flow loss (docs/monst3r_loss_diff.md). Requires the
  # depth head to be predicting AND unfrozen for the depth path to matter, plus loss.depth on:
  # flow-driven depth without a depth anchor lowers the residual and worsens ATE (headroom probe).
  # See dyn_vggt_v3_s1_inst_egoflow.yaml.
  # ego_flow:
  #   weight: 1.0
  #   beta: 1.0
  #   per_pixel_thre: 50.0
  #   max_dt: 5
  #   bidirectional: True
  #   use_dynamic_mask: True
  camera_smooth: null
  # v3 extension: camera-trajectory smoothness regularizer (Δt-normalized 2nd-order term on
  # predicted T/quaternion; addresses observed trajectory "jumps" on hard/dynamic sequences,
  # see conversation notes). Requires img_nums with min >= 4 to avoid wasting batches (needs
  # S>=3 frames per clip). See dyn_vggt_v3_s1_inst_smooth.yaml.
  # camera_smooth:
  #   weight: 0.5
  #   weight_trans: 1.0
  #   weight_rot: 1.0
  #   gamma: 0.6




optim:
  param_group_modifiers: False

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05

  frozen_module_names:
      - "*aggregator*"  # example, freeze the aggregator

  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0   # feel free to reduce this if you see instabilities
        norm_type: 2
      - module_name: ["depth"]
        max_norm: 1.0   # feel free to reduce this if you see instabilities
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0   # feel free to reduce this if you see instabilities
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05




max_epochs: 20

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: True
  enable_depth: True
  enable_point: False
  enable_track: False


distributed:
  # check https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html for options
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True  # Less memory used
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
    cudnn_deterministic: False
    cudnn_benchmark: False
    allow_tf32: True
    # Workaround: the flash-attention SDPA kernel in torch 2.12+cu130 segfaults intermittently
    # on RTX 5090 (Blackwell sm_120) / driver 595 -- it took down training 3× (SIGBUS/SIGSEGV in
    # attention/rope forward). A/B compute repro (outputs/gpu_repro_*.log): flash crashed at
    # ~94 min, mem-efficient ran 120 min clean. Disabling flash makes F.scaled_dot_product_attention
    # fall back to the mem-efficient kernel (identical math, numerically equivalent, stable).
    disable_flash_sdp: True
