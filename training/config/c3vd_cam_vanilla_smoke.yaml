# Smoke test for c3vd_cam_vanilla -- 5 steps, one epoch, channel B on one short sequence.
#
# Three things it is meant to catch, none of which need a real run to surface:
#   1. Does data.datasets.c3vd.C3vdDataset actually feed the trainer -- images, mm-scale
#      depth, world-to-cam extrinsics -- at img_nums [4,12] on square 1024x1024 frames.
#   2. Does the stock VGGT-1B state_dict load into a model built with every enable_* off
#      (bare state_dict, 1797 tensors; "unexpected" should be non-empty, "missing" should not
#      contain anything trainable).
#   3. Does the NEW channel-B branch (trainer.run_pose_eval, dataset: c3vd ->
#      benchmark/eval_c3vd.py) run and return an ATE. This is why pose_eval stays ENABLED
#      here, unlike scared_cam_vanilla_smoke -- that path is the new code.
#
# INHERITS the real config, so it can never drift from what it is supposed to be smoking.
defaults:
  - c3vd_cam_vanilla
  - _self_

exp_name: c3vd_cam_vanilla_smoke
max_epochs: 1
limit_train_batches: 5

pose_eval:
  seqs: ["trans/t3_b"]   # one 214-frame val sequence, not all three
  n_frames: 24
