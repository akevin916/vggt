# Smoke test for c3vd_cam_gts -- 5 steps, one epoch, channel B on one short sequence.
#
# The thing this is really for is VRAM: c3vd_cam_gts adds 8 temporal blocks and a gate
# predictor on top of a run that already peaked at 25/32 GB on square C3VD frames. Watch the
# Mem (GB) column on the step with 12 views, not the average. Also confirms inst_g.pt loads
# into a model with enable_temporal/enable_gate True (it should have far fewer unexpected
# keys than VGGT-1B.pt did) and that reset_gate_head fires on warm start.
#
# INHERITS the real config, so it can never drift from what it is supposed to be smoking.
defaults:
  - c3vd_cam_gts
  - _self_

exp_name: c3vd_cam_gts_smoke
max_epochs: 1
limit_train_batches: 5

pose_eval:
  seqs: ["trans/t3_b"]
  n_frames: 24
