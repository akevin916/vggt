# Smoke test for dyn_vggt_v3_s1_inst_smooth_o1 — 20 steps, one epoch, no pose eval.
#
# Its only job is the two calibration numbers: loss_smooth_T1/R1 (velocity) and T2/R2
# (acceleration) are different physical quantities and cannot share a weight. Read them off the
# log, then set order_weights = [T2/T1, 1.0] and scale `weight` so the whole smooth term is ~25%
# of the objective.
#
# Shape pinned to the worst case for the memory reading (DynamicBatchSampler draws clip length
# uniformly and sets batch = floor(16/S), so image count is ~16 either way but global attention
# is ~ B*(S*P)^2 — 4x larger at S=16; 20 random steps can easily never draw it).
#
# Separate exp_name so the real run's log dir stays clean.
defaults:
  - dyn_vggt_v3_s1_inst_smooth_o1
  - _self_

exp_name: dyn_vggt_v3_s1_inst_smooth_o1_smoke

max_epochs: 1
limit_train_batches: 20
limit_val_batches: 4

pose_eval:
  enabled: false

data:
  train:
    common_config:
      img_nums: [16, 16]
      augs:
        aspects: [1.0, 1.0]
