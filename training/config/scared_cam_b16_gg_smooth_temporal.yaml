# SCARED micro-finetune, arm 2: b16_gg PLUS temporal blocks + camera-trajectory smoothness.
#
# WHY: scared_cam_b16_gg turned out to be, in effect, a plain camera-head finetune. Its
# `loss` block is camera-only (flow/tsmooth/gate/static_photo/camera_smooth all null) and
# `*aggregator.temporal_blocks*` sits in frozen_module_names, so none of the method's own
# machinery trained. Its gate barely fired either -- gate_frac_active averaged 0.003-0.015
# over epochs 5-8, i.e. under 1.5% of patches suppressed, with gate_g_median parked at -0.07.
# It still reached snipATE 0.0832 / 0.0565 on the AF pose trajectories, which is last place
# against every published endoscopy method. This arm turns the two dormant components on.
#
# EXACTLY TWO CHANGES vs scared_cam_b16_gg, so the comparison stays readable:
#   1. temporal_blocks removed from frozen_module_names (8 blocks, 144 tensors, ~100M params)
#   2. loss.camera_smooth switched on
# Warm start, gate config and data are identical, and it starts from the same
# checkpoints/inst_g.pt rather than from b16_gg's result, so the two arms are siblings rather
# than a chain. Batch size and max_epochs are NOT identical -- see the accounting below.
#
# ORDER 2 ONLY (the `orders` default), deliberately. compute_camera_smooth_loss documents
# order 1 as the term that rescues badly-initialised sequences, but order 1 penalises the
# MAGNITUDE of camera motion, and on SCARED this model already under-predicts motion badly:
# over 80 frames it produces 0.368 mm of travel where GT moves 17.10 mm, a factor of 47
# (measured, diag/stitch_error.py). Adding a prior that says "the camera barely moves" to a
# model that already thinks the camera barely moves is the wrong direction. Order 2 penalises
# acceleration and leaves constant velocity free, which is the safe half of the term here.
# The 1st-vs-2nd-order comparison is still an open ablation -- run it as a third arm, not by
# quietly changing this one.
#
# MAX_EPOCHS STAYS 10, matching b16_gg. It is not a "run longer" knob: `where = epoch /
# max_epochs` drives the LR schedule (trainer.py:845), so raising it reshapes the whole
# cosine -- warmup 1500 steps instead of 750, and a slower tail at every epoch. b16_gg's
# header puts it plainly: "a 10-epoch run is not the first 10 epochs of a 20-epoch run".
# Keeping 10 costs ~6.4 h here (38 min/epoch at batch 12) and keeps the LR curve out of the
# list of things that differ.
#
# So the honest accounting of this arm vs scared_cam_b16_gg is THREE differences
# (the third being a paired change to both view-count knobs):
#   1. temporal_blocks trainable   (intended factor)
#   2. loss.camera_smooth on       (intended factor)
#   3. img_nums [4,16] -> [4,12] and max_img_per_gpu 16 -> 12   (forced by VRAM)
# Any claim that "temporal+smooth helps" drawn from this pair is still confounded by 3.
# Isolating it needs b16_gg re-run at batch 12 (~10 h) -- worth doing before the difference
# goes into a paper, not before it goes into a decision.
#
# VRAM: b16_gg peaked at 31.0 / 32.6 GiB. Unfreezing 8 temporal blocks adds their gradients
# and Adam state, roughly 1.2-1.6 GiB, which does not fit. max_img_per_gpu therefore drops
# 16 -> 10. That IS a third difference from b16_gg and it changes the batch composition;
# it is forced by the hardware, not chosen, and must be stated whenever the two are compared.
#
# THE REAL KNOB IS img_nums, NOT max_img_per_gpu. A first attempt at max_img_per_gpu 12
# survived a 25-step smoke and 1h20m of training, then died at epoch 1 with a 1.03 GiB
# allocation failure inside depth_head (dpt_head.py:259) with 929 MiB free; dropping to 10
# changed the peak not at all. dynamic_dataloader.py:173 explains why:
#     batch_size = max(1, floor(max_img_per_gpu / random_image_num))
# so when the sampler draws random_image_num=16 the floor is 0, max() lifts it to 1, and the
# batch carries 16 images -- ABOVE the cap. max_img_per_gpu only binds while img_nums' upper
# bound is below it; the true worst case is always max(img_nums). Hence img_nums [4, 16] ->
# [4, 12], paired with max_img_per_gpu 12 so every batch lands on ~12 images
# (floor(12/12)=1, floor(12/4)=3) instead of swinging.
#
# The aggregator already activation-checkpoints its frame/global/temporal blocks
# (aggregator.py:432/475/482/626), so the extra memory is Adam state and gradients for the
# newly-trainable temporal blocks -- fixed overhead that cannot be checkpointed away.
# depth_head is frozen and loss.depth is null, yet it still runs and still retains activations
# because the aggregator tokens feeding it require grad. It cannot just be dropped: the depth
# numbers we report come from it. Launch with PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True.
#
# THIS IS A FOURTH DIFFERENCE from b16_gg, which trained on img_nums [4, 16]. Fewer views per
# sample is not neutral for a multi-view model -- it is exactly the axis the depth results
# turned out to be most sensitive to.
#
# INHERITS scared_cam_b16_gg.yaml (which inherits scared_cam_b16.yaml). Only the three
# differences listed above are restated here.
defaults:
  - scared_cam_b16_gg
  - _self_

exp_name: scared_cam_b16_gg_smooth_temporal

# Difference 3 (forced by VRAM): the real knob is img_nums' upper bound, not max_img_per_gpu.
max_img_per_gpu: 12

data:
  train:
    common_config:
      img_nums: [4, 12]
  val:
    common_config:
      img_nums: [4, 12]

logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_camera_smooth   # the new term
        - loss_smooth_T
        - loss_smooth_R
        - gate_g_median
        - gate_frac_active
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_camera_smooth
        - gate_g_median
        - gate_frac_active

loss:
  # Difference 2. `orders` left at its default (2,) on purpose -- see the header.
  camera_smooth:
    weight: 3.0
    weight_trans: 1.0
    weight_rot: 1.0
    gamma: 0.6

optim:
  # Difference 1: parent's list MINUS temporal_blocks.
  # Hydra REPLACES lists rather than merging them, so the whole list is restated.
  frozen_module_names:
      - "*aggregator.patch_embed*"
      - "*aggregator.frame_blocks*"
      - "*aggregator.global_blocks.[0-7]"
      - "*depth_head*"
  gradient_clip:
    configs:
      - module_name: ["aggregator.global_blocks", "camera_head"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["aggregator.camera_token", "aggregator.register_token"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["aggregator.gate_predictor"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["aggregator.temporal_blocks"]   # newly trainable in this arm
        max_norm: 1.0
        norm_type: 2
