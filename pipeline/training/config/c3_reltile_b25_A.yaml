# 3-3 stage A: frozen tfs_fpos_seed43, learn ONLY the frame-distance tile mask theta [6, 8, 8]
# (384 params, shared by global blocks 8-23). Frame-distance buckets 1|2|3-4|5-8|9-16|>=17; tile 8x8.
# Same setup as 3-2 (scared_cam_depth_tfs_fpos_seed43_colmask_r25): 1000 steps, rho 1 -> 0.25
# linearly over 60%, straight-through last 20%, budget by projection (here WEIGHTED by the keys each
# cell stands for in a 64-frame chunk), lr 0.02, S=32 contiguous, 518x420 (errata #2, 2026-10-23).
# theta init 5 + N(0, 0.01^2) seeded. Diagonal + one mean token per query frame.
# Written 2026-10-23.
defaults:
- scared_cam_depth_tfs_fpos_seed43_colmask_r25
- _self_
exp_name: c3_reltile_b25_A
model:
  enable_colmask: false
  enable_relmask: true
  relmask_buckets: [1, 2, 4, 8, 16]
  relmask_tile: [8, 8]
  relmask_start: 8
  relmask_grid: [30, 37]
  relmask_init: 5.0
  relmask_init_std: 0.01
  relmask_seed: 0
  relmask_rho: 0.25
  relmask_ramp_frac: 0.6
  relmask_st_frac: 0.2
  relmask_budget_S: 64
optim:
  gradient_clip:
    configs:
    - module_name:
      - aggregator.relmask_theta
      max_norm: null
      norm_type: 2
