# 3-7 stage A (rho = 0.50): c3_reltile_b25_A with a PER-BUCKET budget weighted by keys per tile
# slot (each bucket keeps 0.50 of its keys), tau_b solved in the forward, temperature
# T 1 -> 0.05 over steps 500-1100, straight-through hard mask from step 1100. 1500 steps
# (3 epochs x 500). Warm start = tfs_abs on this machine (checkpoints/scared_tfs_abs/epoch_10.pt).
# Written 2026-10-26.
defaults:
- c3_reltile_b25_A
- _self_
exp_name: c3_pos_b50_A
max_epochs: 3
max_img_per_gpu: 48     # S=64 OOMs on one 5090 (smoke 2026-10-26: S=48 ~31 GB, 13 s/step)
checkpoint:
  resume_checkpoint_path: checkpoints/scared_tfs_abs/epoch_10.pt
model:
  relmask_rho: 0.50
  relmask_budget: per_bucket
  relmask_rho_steps: 500
  relmask_T_start: 1.0
  relmask_T_end: 0.05
  relmask_T_steps: [500, 1100]
  relmask_hard_from: 1100
