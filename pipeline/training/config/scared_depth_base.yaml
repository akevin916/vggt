# FLAT base for runs on another machine: scared_cam_vanilla_depth fully composed (default -> scared_cam_vanilla -> scared_cam_vanilla_depth), no defaults chain.
# Generated 2026-09-30 by make_portable_configs.py. Children inherit ONLY this file.
# Running it directly reproduces scared_cam_vanilla_depth under a different exp_name.
data:
  train:
    _target_: pipeline.data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: true
    pin_memory: false
    common_config:
      fix_img_num: -1
      fix_aspect_ratio: 1.0
      load_track: false
      track_num: 1024
      training: true
      inside_random: true
      img_size: ${img_size}
      patch_size: ${patch_size}
      rescale: true
      rescale_aug: true
      landscape_check: false
      debug: false
      get_nearby: true
      load_depth: true
      img_nums:
      - 4
      - 12
      max_img_per_gpu: 48
      allow_duplicate_img: true
      repeat_batch: false
      augs:
        cojitter: true
        cojitter_ratio: 0.3
        scales:
        - 0.8
        - 1.2
        aspects:
        - 0.33
        - 1.0
        color_jitter:
          brightness: 0.5
          contrast: 0.5
          saturation: 0.5
          hue: 0.1
          p: 0.9
        gray_scale: true
        gau_blur: false
    dataset:
      _target_: pipeline.data.composed_dataset.ComposedDataset
      dataset_configs:
      - _target_: pipeline.data.datasets.scared.ScaredDataset
        split: train
        SCARED_DIR: data/train/scared
        len_train: 6000
        depth_max: 655.35
        dynamic_source: none
  val:
    _target_: pipeline.data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: true
    pin_memory: false
    common_config:
      fix_img_num: -1
      fix_aspect_ratio: 1.0
      load_track: false
      track_num: 1024
      training: false
      inside_random: true
      img_size: ${img_size}
      patch_size: ${patch_size}
      rescale: true
      rescale_aug: false
      landscape_check: false
      debug: false
      get_nearby: true
      load_depth: true
      img_nums:
      - 4
      - 12
      allow_duplicate_img: true
      augs:
        cojitter: false
        cojitter_ratio: 0.5
        scales: null
        aspects:
        - 1.0
        - 1.0
        color_jitter: null
        gray_scale: false
        gau_blur: false
    dataset:
      _target_: pipeline.data.composed_dataset.ComposedDataset
      dataset_configs:
      - _target_: pipeline.data.datasets.scared.ScaredDataset
        split: val
        SCARED_DIR: data/train/scared
        dynamic_source: none
exp_name: scared_depth_base
img_size: 518
num_workers: 4
seed_value: 42
accum_steps: 1
patch_size: 14
max_img_per_gpu: 12
limit_train_batches: 1500
limit_val_batches: 200
pose_eval:
  enabled: true
  # scared_primary (2026-10-05): every epoch scores TEST pose c64 + depth multi (chunk 64 / overlap 16,
  # trainer defaults) and picks best_ate.pt on c64. Equals the eval_scared CLI exactly under the same
  # backend (flash off, TF32 on); the default CLI (flash on) differs by <= 0.1%.
  dataset: scared_primary
  every_n_epochs: 1
  sintel_root: null
  seq_list: null
  chunk_size: 0
  max_depth: 200.0
  split: val
  n_frames: 50
logging:
  log_dir: logs/${exp_name}
  log_visuals: false
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: false
  tensorboard_writer:
    _target_: pipeline.training.train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
      - loss_objective
      - loss_camera
      - loss_T
      - loss_R
      - loss_conf_depth
      - loss_reg_depth
      - loss_grad_depth
    val:
      keys_to_log:
      - loss_objective
      - loss_camera
      - loss_conf_depth
      - loss_reg_depth
checkpoint:
  save_dir: ${logging.log_dir}/ckpts
  save_freq: 5
  resume_checkpoint_path: checkpoints/VGGT-1B.pt
  strict: false
  save_steps_freq: 1000
loss:
  _target_: pipeline.training.loss.MultitaskLoss
  camera:
    weight: 5.0
    loss_type: l1
    gamma: 0.6
  depth:
    weight: 1.0
    gradient_loss_fn: grad
    valid_range: 0.98
    alpha: 0.02
  point: null
  track: null
  static_photo: null
  ego_flow: null
  camera_smooth: null
  gate: null
optim:
  param_group_modifiers: false
  optimizer:
    _target_: torch.optim.AdamW
    lr: 3.0e-05
    weight_decay: 0.05
  frozen_module_names:
  - '*aggregator.patch_embed*'
  - '*aggregator.frame_blocks*'
  - '*aggregator.global_blocks.[0-7]'
  amp:
    enabled: true
    amp_dtype: bfloat16
  gradient_clip:
    _target_: pipeline.training.train_utils.gradient_clip.GradientClipper
    configs:
    - module_name:
      - aggregator.global_blocks
      - camera_head
      max_norm: 1.0
      norm_type: 2
    - module_name:
      - aggregator.camera_token
      - aggregator.register_token
      max_norm: 1.0
      norm_type: 2
    - module_name:
      - depth_head
      max_norm: 1.0
      norm_type: 2
  options:
    lr:
    - scheduler:
        _target_: fvcore.common.param_scheduler.CompositeParamScheduler
        schedulers:
        - _target_: fvcore.common.param_scheduler.LinearParamScheduler
          start_value: 1.0e-08
          end_value: 3.0e-05
        - _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 3.0e-05
          end_value: 1.0e-08
        lengths:
        - 0.05
        - 0.95
        interval_scaling:
        - rescaled
        - rescaled
    weight_decay:
    - scheduler:
        _target_: fvcore.common.param_scheduler.ConstantParamScheduler
        value: 0.05
max_epochs: 10
model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: true
  enable_depth: true
  enable_point: false
  enable_track: false
  enable_temporal: false
  enable_gate: false
  gate_block_iter: 7
distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: false
  timeout_mins: 30
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  broadcast_buffers: true
cuda:
  cudnn_deterministic: false
  cudnn_benchmark: false
  allow_tf32: true
  disable_flash_sdp: true
val_epoch_freq: 1
