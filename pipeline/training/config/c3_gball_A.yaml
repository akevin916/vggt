# 3-10 stage A, ball: frozen tfs_abs, learn ONLY the Gaussian spatio-temporal key mask
# (vggt/models/gaussmask.py; 3 params x 16 global layers 8-23). rho = 0.25 of the other-frame,
# key-frame>=1 pairs in a 64-frame chunk; c^2 solved per layer per step, so sigma sets only shape.
# Decision 2026-10-28 (option C): S=48 contiguous (S=64 OOMs), 500 steps instead of the spec's
# 1500 -- the table-lookup flex backward costs ~4.3 s per layer at S=48. Schedule scaled 1/3:
# T 2 -> 0.1 over steps 0-367, straight-through hard boundary from step 367; convergence check =
# last 100 steps. tfs_abs warm start, lr 0.02, 518x420, contiguous stride-1 clips.
# Written 2026-10-28. Flattened 2026-10-29 when relmask / colmask left slim: it used to inherit
# c3_pos_b25_A -> c3_reltile_b25_A -> scared_cam_depth_tfs_fpos_seed43_colmask_r25 (all removed);
# every setting it took from them is written out below, nothing else changed.
defaults:
- scared_cam_depth_tfs_fpos_seed43
- _self_

exp_name: c3_gball_A

max_img_per_gpu: 48
max_epochs: 1
limit_train_batches: 500
limit_val_batches: 20

checkpoint:
  resume_checkpoint_path: checkpoints/scared_tfs_abs/epoch_10.pt
  warm_start_weights_only: true
  strict: false
  save_steps_freq: 100   # rolling last.pt every 100 steps: the host drops GPUs (Xid 79), resume with --resume

model:
  head_grad_checkpoint: true   # gradients cross the frozen depth head; its activations scale with S
  gaussmask:
    enable: true
    rho: 0.25
    S_max: 64
    start: 8
    grid: [30, 37]
    T_start: 2.0
    T_end: 0.1
    T_steps: [0, 367]
    hard_from: 367
    init: {sigma_s: 8.0, sigma_y: 6.0, sigma_x: 6.0}

# Sampling: contiguous stride-1 clips of S frames at the test crop (518x420 -> 30x37 patches);
# the aspect augmentation is pinned to 0.82 (518*0.82 -> 420), the other train augs are tfs's.
data:
  train:
    common_config:
      img_nums: [ "${max_img_per_gpu}", "${max_img_per_gpu}" ]
      max_img_per_gpu: ${max_img_per_gpu}
      augs:
        aspects: [0.82, 0.82]
    dataset:
      dataset_configs:
      - _target_: pipeline.data.datasets.scared.ScaredDataset
        split: train
        SCARED_DIR: data/train/scared
        len_train: 6000
        depth_max: 655.35
        dynamic_source: none
        contiguous_stride: 1
  val:
    common_config:
      img_nums: [ "${max_img_per_gpu}", "${max_img_per_gpu}" ]
      augs:
        aspects: [0.82, 0.82]
    dataset:
      dataset_configs:
      - _target_: pipeline.data.datasets.scared.ScaredDataset
        split: val
        SCARED_DIR: data/train/scared
        dynamic_source: none
        contiguous_stride: 1

optim:
  # Freeze by SUBMODULE, never '*': a frozen module is locked in eval mode, and the aggregator
  # must stay in train mode (gradient checkpointing + the soft-mask training forward).
  frozen_module_names:
  - '*aggregator.patch_embed*'
  - '*aggregator.frame_blocks*'
  - '*aggregator.global_blocks*'
  - '*aggregator.temporal_blocks*'
  - '*camera_head*'
  - '*depth_head*'
  frozen_param_names:
  - aggregator.camera_token
  - aggregator.register_token
  optimizer:
    _target_: torch.optim.AdamW
    lr: 2.0e-02
    weight_decay: 0.0    # decay would pull the log-sigmas toward 0, i.e. sigma toward 1
    eps: 1.0e-12
  gradient_clip:
    configs:
    - module_name:
      - aggregator.gaussmask
      max_norm: null
      norm_type: 2
  options:
    lr:
    - scheduler:
        _target_: fvcore.common.param_scheduler.ConstantParamScheduler
        value: 2.0e-02
    weight_decay:
    - scheduler:
        _target_: fvcore.common.param_scheduler.ConstantParamScheduler
        value: 0.0
