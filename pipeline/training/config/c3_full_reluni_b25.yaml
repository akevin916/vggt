# 3-6 (new): the full tfs_fpos_seed43 recipe FROM VGGT-1B (10 epochs x 1500 steps, lr 3e-5, seed 43,
# temporal_frame_pos, same sampling), with a FIXED uniform frame-distance mask on global 8-23 from
# step 0. Only recipe difference from tfs_fpos_seed43: aspect pinned to 518x420 (the mask is a
# 30x37 grid) -- state this in the paper. relmask_path = the file chosen by 3-6 step 1.
# Written 2026-10-26.
defaults:
- scared_cam_depth_tfs_fpos_seed43
- _self_
exp_name: c3_full_reluni_b25
checkpoint:
  save_steps_freq: 500   # host drops GPUs (Xid 79); resume with --resume
data:
  train:
    common_config:
      augs:
        aspects: [0.82, 0.82]
  val:
    common_config:
      augs:
        aspects: [0.82, 0.82]
model:
  relmask_path: outputs/colmask/reluni_rand_s0.npy
  relmask_buckets: [1, 2, 4, 8, 16]
  relmask_tile: [8, 8]
  relmask_start: 8
