# 3-3 stage B: c3_ft_ctrl + the FIXED frame-distance tile mask exported from c3_reltile_b25_A.
# Frame distance from the REAL frame ids (trainer passes batch ids; temporal_frame_pos is on), so the
# +-2N random window maps to true distances (all beyond 16 land in the >=17 bucket) (errata #6).
# Not saved in the ckpt: eval needs --relmask <npy>. Written 2026-10-23.
defaults:
- c3_ft_ctrl
- _self_
exp_name: c3_ft_reltile_b25
model:
  relmask_path: outputs/colmask/relmask_b25.npy
  relmask_buckets: [1, 2, 4, 8, 16]
  relmask_tile: [8, 8]
  relmask_start: 8
